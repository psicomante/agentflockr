name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

# Nothing gets write access unless a job asks for it.
permissions:
  contents: read

# Actions are pinned by commit SHA, because a tag can be moved and the
# release job holds a token that can replace the archives and checksums.txt
# together. The comment names the version; Dependabot updates both.
jobs:
  # Runs the tests with a read-only token, so no dependency's init() ever
  # executes in a job that can write to the repository.
  check:
    name: Check ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/*.go
      - name: Check
        run: make check

  # Only builds and uploads. It never runs the project's tests or restores
  # a build cache that other workflows wrote.
  release:
    name: Release ${{ github.ref_name }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
